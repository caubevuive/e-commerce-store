<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:fragment="layout(content)">
<head>
<meta charset="UTF-8">
<title>Ecom Store</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
	crossorigin="anonymous">

<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
	integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
	crossorigin="anonymous" referrerpolicy="no-referrer" />

<link rel="stylesheet" href="/css/style.css">
</head>

<body class="d-flex flex-column min-vh-100">

	<!-- Start navbar -->
	<nav class="navbar navbar-expand-lg bg-primary fixed-top navbar-dark">
		<div class="container-fluid">
			<a class="navbar-brand" href="/"> <i
				class="fa-solid fa-cart-shopping"></i> Ecom Store
			</a>
			<button class="navbar-toggler" type="button"
				data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
				aria-controls="navbarSupportedContent" aria-expanded="false"
				aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="navbarSupportedContent">
				<ul class="navbar-nav me-auto mb-2 mb-lg-0">
					<li class="nav-item"><a class="nav-link active"
						aria-current="page" href="/"> <i class="fa-solid fa-house"></i>
							Home
					</a></li>
					<li class="nav-item"><a class="nav-link active"
						aria-current="page" href="/products">Product</a></li>


					<li class="nav-item dropdown"><a
						class="nav-link dropdown-toggle active" href="#" role="button"
						data-bs-toggle="dropdown" aria-expanded="false"> Category </a>
						<ul class="dropdown-menu">
							<li th:each="c : ${categorys}"><a class="dropdown-item"
								th:href="@{'/products?category=' + ${c.name}}"
								th:text="${c.name}">Category Name</a></li>
						</ul></li>
				</ul>

				<!-- Right Side Navigation Menu -->
				<ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center">

					<th:block th:if="${user == null}">
						<li class="nav-item"><a class="nav-link active"
							href="/signin"> <i class="fa-solid fa-right-to-bracket"></i>
								LOGIN
						</a></li>
						<li class="nav-item"><a class="nav-link active"
							href="/register">REGISTER</a></li>
					</th:block>


					<th:block th:if="${user != null}">

						
						<li class="nav-item me-3"
							th:if="${user.role == 'ROLE_USER' or user.role == 'USER'}">
							<a class="nav-link active position-relative"
							th:href="@{/user/cart}"> <i class="fa-solid fa-cart-shopping"></i>
								Cart <span
								class="position-absolute top-25 start-100 translate-middle badge rounded-pill bg-danger"
								th:text="${countCart != null ? countCart : 0}"> 0 </span>
						</a>
						</li>

						
						<li class="nav-item me-3"
							th:if="${user.role == 'ROLE_USER' or user.role == 'USER'}">
							<a class="nav-link active" th:href="@{/user/my-orders}"> <i
								class="fa-solid fa-box-archive me-1"></i> My Orders
						</a>
						</li>


						<li class="nav-item dropdown"><a
							class="nav-link dropdown-toggle active" href="#" role="button"
							data-bs-toggle="dropdown" aria-expanded="false"> <i
								class="fa-solid fa-user me-1"></i>[[${user.name}]]
						</a>
							<ul class="dropdown-menu dropdown-menu-end">
								
								<li th:if="${user.role == 'ROLE_ADMIN' or user.role == 'ADMIN'}">
									<a class="dropdown-item" href="/admin/"><i
										class="fa-solid fa-user-gear me-2"></i>Admin Dashboard</a>
								</li>

								
								<li th:if="${user.role == 'ROLE_USER' or user.role == 'USER'}">
									<a class="dropdown-item" href="/user/"><i
										class="fa-solid fa-id-card me-2"></i>My Profile</a>
								</li>
								<li><hr class="dropdown-divider"></li>
								<li><a class="dropdown-item text-danger" href="/logout"><i
										class="fa-solid fa-right-from-bracket me-2"></i>Logout</a></li>
							</ul></li>
					</th:block>

				</ul>
			</div>
		</div>
	</nav>
	<!-- End Navbar -->

	<div class="flex-grow-1" style="margin-top: 56px;">
		<div th:insert="${content}"></div>
	</div>

	<!-- Start Footer -->
	<footer class="bg-primary text-white text-center py-2">
		<p class="mb-0">ecom.com</p>
	</footer>
	<!-- End Footer -->

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
		crossorigin="anonymous"></script>

</body>
</html>
