<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Add Product</title>
</head>
<body>
	<section>
		<div class="container p-5 mt-3">
			<div class="row">
				<div class="col-md-8 offset-md-2">
					<div class="card card-sh">
						<div class="card-header text-center fs-4 fw-bold">Add
							Product</div>
						<div class="card-body">

							<th:block th:if="${session.succMsg}">
								<p class="text-success fw-bold text-center">[[${session.succMsg}]]</p>
								<!-- <th:block th:text="${@commonServiceImpl.removeSessionMessage()}"></th:block> -->
							</th:block>

							<th:block th:if="${session.errorMsg}">
								<p class="text-danger fw-bold text-center">[[${session.errorMsg}]]</p>
								<!-- <th:block th:text="${@commonServiceImpl.removeSessionMessage()}"></th:block> -->
							</th:block>

							<form action="/admin/saveProduct" method="post"
								enctype="multipart/form-data">

								<div class="mb-3">
									<label class="form-label">Enter Title</label> <input
										type="text" name="title" class="form-control" required>
								</div>

								<div class="mb-3">
									<label class="form-label">Enter Description</label>
									<textarea rows="3" class="form-control" name="description"
										required></textarea>
								</div>

								<div class="row">
									<div class="mb-3 col">
										<label class="form-label">Category</label> <select
											class="form-control" name="category" required>
											<option value="">-- Select Category --</option>
											<option th:each="c:${categories}" th:value="${c.name}">[[${c.name}]]</option>
										</select>
									</div>

									<div class="mb-3 col">
										<label class="form-label">Enter Price</label> <input
											type="number" step="0.01" name="price" class="form-control"
											required>
									</div>
								</div>

								<div class="row">
									<div class="mb-3 col">
										<label class="form-label">Discount (%)</label> <input
											type="number" name="discount" class="form-control" value="0"
											required>
									</div>

									<div class="mb-3 col">
										<label class="form-label">Enter Stock</label> <input
											type="number" name="stock" class="form-control" required>
									</div>
								</div>

								<div class="row">
									<div class="mb-3 col">
										<label class="form-label">Status</label>
										<div class="form-check">
											<input class="form-check-input" type="radio" checked
												value="true" name="isActive" id="flexRadioDefault1">
											<label class="form-check-label" for="flexRadioDefault1">Active</label>
										</div>
										<div class="form-check">
											<input class="form-check-input" type="radio" value="false"
												name="isActive" id="flexRadioDefault2"> <label
												class="form-check-label" for="flexRadioDefault2">Inactive</label>
										</div>
									</div>

									<div class="mb-3 col">
										<label class="form-label">Upload Image</label> <input
											type="file" name="file" class="form-control" required>
									</div>
								</div>

								<button class="btn btn-primary col-md-12 mt-3">
									<i class="fa-solid fa-plus me-1"></i> Save
								</button>
							</form>
						</div>
					</div>
				</div>
			</div>
		</div>
	</section>
</body>
</html>
