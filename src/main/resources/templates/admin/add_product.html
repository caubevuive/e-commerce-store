<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Add Product</title>
</head>
<body>
	<section>
		<div class="container p-5">
			<div class="row">
				<div class="col-md-6 offset-md-3">
					<div class="card card-sh">
						<div class="card-header text-center fs-4">
							<p class="fs-4 mb-0">Add Product</p>
						</div>
						<div class="card-body">
							<form action="/admin/saveProduct" method="post"
								enctype="multipart/form-data">

								<!-- Title -->
								<div class="mb-3">
									<label class="form-label">Enter Title</label> <input
										type="text" name="title" class="form-control">
								</div>

								<!-- Description -->
								<div class="mb-3">
									<label class="form-label">Enter Description</label>
									<textarea rows="3" cols="" class="form-control"
										name="description"></textarea>
								</div>

								
								<div class="mb-3">
									<label class="form-label">Enter Category</label> <select
										class="form-control" name="category">
										<option>--select--</option>
									</select>
								</div>

								<!-- Price -->
								<div class="mb-3">
									<label class="form-label">Enter Price</label> <input
										type="number" name="price" class="form-control">
								</div>

								
								<div class="row mb-3">
									<div class="col">
										<label class="form-label">Stock</label> <input type="number"
											name="stock" class="form-control">
									</div>

									<div class="col">
										<label class="form-label">Image</label> <input type="file"
											name="file" class="form-control">
									</div>
								</div>

								<!-- Submit Button -->
								<button class="btn btn-primary col-md-12 mt-2">Submit</button>

							</form>
						</div>
					</div>
				</div>
			</div>
		</div>
	</section>
</body>
</html>
