<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Checkout Page</title>
</head>
<body>
	<section>
		<div class="container mt-5 p-5">
			<form action="#" th:action="@{/user/save-order}" method="post">
				<div class="row">

					<!-- Cột thông tin giao hàng -->
					<div class="col-md-6">
						<p class="fs-4 fw-bold text-center">Billing Address</p>
						<hr>
						<div class="row">
							<div class="col">
								<label class="form-label">First Name</label> <input type="text"
									name="firstName" required class="form-control">
							</div>
							<div class="col">
								<label class="form-label">Last Name</label> <input type="text"
									name="lastName" required class="form-control">
							</div>
						</div>

						<div class="mb-3 mt-3">
							<label class="form-label">Email</label> <input type="email"
								name="email" required class="form-control">
						</div>

						<div class="mb-3">
							<label class="form-label">Mobile Number</label> <input
								type="text" name="mobileNo" required class="form-control">
						</div>

						<div class="mb-3">
							<label class="form-label">Address</label> <input type="text"
								name="address" required class="form-control">
						</div>

						<div class="row">
							<div class="col">
								<label class="form-label">City</label> <input type="text"
									name="city" required class="form-control">
							</div>
							<div class="col">
								<label class="form-label">State</label> <input type="text"
									name="state" required class="form-control">
							</div>
							<div class="col">
								<label class="form-label">Pincode</label> <input type="text"
									name="pincode" required class="form-control">
							</div>
						</div>
					</div>

					<!-- Cột tổng quan đơn hàng -->
					<div class="col-md-6">
						<p class="fs-4 fw-bold text-center">Order Summary</p>
						<hr>
						<table class="table">
							<thead>
								<tr>
									<th>Item</th>
									<th>Price</th>
									<th>Quantity</th>
									<th>Total</th>
								</tr>
							</thead>
							<tbody>
								<tr th:each="c : ${carts}">
									<td th:text="${c.product.title}"></td>
									<td th:text="${c.product.discountPrice}"></td>
									<td th:text="${c.quantity}"></td>
									<td th:text="${c.totalPrice}"></td>
								</tr>
								<tr>
									<td colspan="3" class="fw-bold">Total Price</td>
									<td class="fw-bold" th:text="${'$' + totalOrderPrice}"></td>
								</tr>
							</tbody>
						</table>

						<p class="fs-5 fw-bold mt-4">Payment Type</p>
						<hr>
						<div class="form-check">
							<input class="form-check-input" type="radio" name="paymentType"
								value="COD" checked> <label class="form-check-label">Cash
								On Delivery (COD)</label>
						</div>
						<div class="form-check">
							<input class="form-check-input" type="radio" name="paymentType"
								value="ONLINE"> <label class="form-check-label">Online
								Payment</label>
						</div>

						<div class="text-center mt-4">
							<button type="submit" class="btn bg-primary text-white col-md-6">Place
								Order</button>
						</div>
					</div>
				</div>
			</form>
		</div>
	</section>
</body>
</html>
