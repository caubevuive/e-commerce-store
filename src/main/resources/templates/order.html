<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Checkout Page</title>
<!-- Thêm FontAwesome cho icon sinh động -->
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">
	<section>
		<div class="container py-5">
			<!-- Tiêu đề trang -->
			<div class="row mb-4">
				<div class="col-md-12">
					<h2 class="fw-bold text-dark">
						<i class="fa-solid fa-credit-card me-2 text-primary"></i> Checkout
					</h2>
					<nav aria-label="breadcrumb">
						<ol class="breadcrumb">
							<li class="breadcrumb-item"><a href="/"
								class="text-decoration-none">Home</a></li>
							<li class="breadcrumb-item"><a href="/user/cart"
								class="text-decoration-none">Cart</a></li>
							<li class="breadcrumb-item active" aria-current="page">Checkout</li>
						</ol>
					</nav>
				</div>
			</div>

			<form action="#" th:action="@{/user/save-order}" method="post">
				<div class="row g-4">

					<!-- Cột thông tin giao hàng (Billing Address) -->
					<div class="col-lg-7">
						<div class="card border-0 shadow-sm rounded-4 p-4 bg-white h-100">
							<h4 class="fw-bold mb-3 text-dark">
								<i class="fa-solid fa-truck-fast me-2 text-primary"></i> Billing
								Address
							</h4>
							<hr class="text-muted mb-4">

							<div class="row g-3">
								<div class="col-md-6">
									<label class="form-label fw-semibold text-secondary small">First
										Name</label> <input type="text" name="firstName" required
										class="form-control rounded-3 py-2" placeholder="First Name">
								</div>
								<div class="col-md-6">
									<label class="form-label fw-semibold text-secondary small">Last
										Name</label> <input type="text" name="lastName" required
										class="form-control rounded-3 py-2" placeholder="Last Name">
								</div>
							</div>

							<div class="mb-3 mt-3">
								<label class="form-label fw-semibold text-secondary small">Email</label>
								<input type="email" name="email" required
									class="form-control rounded-3 py-2"
									placeholder="name@example.com">
							</div>

							<div class="mb-3">
								<label class="form-label fw-semibold text-secondary small">Mobile
									Number</label> <input type="text" name="mobileNo" required
									class="form-control rounded-3 py-2" placeholder="Phone Number">
							</div>

							<div class="mb-3">
								<label class="form-label fw-semibold text-secondary small">Address</label>
								<input type="text" name="address" required
									class="form-control rounded-3 py-2"
									placeholder="Street Address">
							</div>

							<div class="row g-3">
								<div class="col-md-4">
									<label class="form-label fw-semibold text-secondary small">City</label>
									<input type="text" name="city" required
										class="form-control rounded-3 py-2" placeholder="City">
								</div>
								<div class="col-md-4">
									<label class="form-label fw-semibold text-secondary small">State</label>
									<input type="text" name="state" required
										class="form-control rounded-3 py-2" placeholder="State">
								</div>
								<div class="col-md-4">
									<label class="form-label fw-semibold text-secondary small">Pincode</label>
									<input type="text" name="pincode" required
										class="form-control rounded-3 py-2" placeholder="Pincode">
								</div>
							</div>
						</div>
					</div>

					<!-- Cột tổng quan đơn hàng & Thanh toán -->
					<div class="col-lg-5">
						<div class="card border-0 shadow-sm rounded-4 p-4 bg-white mb-4">
							<h4 class="fw-bold mb-3 text-dark">
								<i class="fa-solid fa-box-open me-2 text-primary"></i> Order
								Summary
							</h4>
							<hr class="text-muted">

							<div class="table-responsive">
								<table class="table align-middle mb-2">
									<thead class="table-light fs-7 text-uppercase">
										<tr>
											<th class="py-2">Item</th>
											<th class="py-2">Price</th>
											<th class="py-2 text-center">Qty</th>
											<th class="py-2 text-end">Total</th>
										</tr>
									</thead>
									<tbody>
										<tr th:each="c : ${carts}">
											<td class="fw-semibold text-dark"
												th:text="${c.product.title}"></td>
											<td
												th:text="${'$' + #numbers.formatDecimal(c.product.discountPrice, 1, 2)}"></td>
											<td class="text-center" th:text="${c.quantity}"></td>
											<td class="text-end fw-bold text-primary"
												th:text="${'$' + #numbers.formatDecimal(c.totalPrice, 1, 2)}"></td>
										</tr>
									</tbody>
								</table>
							</div>

							<hr class="text-muted">
							<div
								class="d-flex justify-content-between align-items-center mb-2">
								<span class="fw-bold fs-5 text-dark">Total Price</span> <span
									class="fw-bold fs-4 text-primary"
									th:text="${'$' + #numbers.formatDecimal(totalOrderPrice, 1, 2)}"></span>
							</div>
						</div>

						<div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
							<h4 class="fw-bold mb-3 text-dark">
								<i class="fa-solid fa-wallet me-2 text-primary"></i> Payment
								Type
							</h4>
							<hr class="text-muted mb-3">

							<div class="d-flex flex-column gap-3 mb-4">
								<div class="form-check border p-3 rounded-3 shadow-sm">
									<input class="form-check-input mt-1" type="radio"
										name="paymentType" value="COD" id="cod"> <label
										class="form-check-label fw-semibold text-dark ms-2" for="cod">
										<i class="fa-solid fa-truck text-success me-2"></i> Cash On
										Delivery (COD)
									</label>
								</div>

								<div class="form-check border p-3 rounded-3 shadow-sm">
									<input class="form-check-input mt-1" type="radio"
										name="paymentType" value="Online Payment" id="online" checked>
									<label class="form-check-label fw-semibold text-dark ms-2"
										for="online"> <i
										class="fa-solid fa-credit-card text-primary me-2"></i> Online
										payment
									</label>
								</div>
							</div>

							<button type="submit"
								class="btn btn-primary w-100 py-3 rounded-pill fw-bold shadow-sm">
								<i class="fa-solid fa-circle-check me-2"></i> Place Order
							</button>
						</div>
					</div>
				</div>
			</form>
		</div>
	</section>
</body>
</html>
