<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Forgot Password</title>
</head>
<body>
	<section>
		<div class="container my-5">
			<div class="row align-items-center justify-content-center">
				<div class="col-md-5">
					<div class="card shadow-sm border">
						<div class="card-header bg-light">
							<p class="fs-4 text-center mb-0">Forgot Password</p>
						</div>
						<div class="card-body">

							<!-- Success / Error Messages -->
							<div th:if="${session.succMsg}" class="alert alert-success text-center p-2 mb-3" role="alert">
								[[${session.succMsg}]]
							</div>
							<div th:if="${session.errorMsg}" class="alert alert-danger text-center p-2 mb-3" role="alert">
								[[${session.errorMsg}]]
							</div>
							<th:block th:text="${@commonServiceImpl.removeSessionMessage()}"></th:block>

							<form action="/forgot-password" method="post">
								<div class="mb-3">
									<label class="form-label">Enter your registered email</label> 
									<input class="form-control" name="email" type="email" required>
								</div>
								<button type="submit" class="btn btn-primary w-100">Send Reset Link</button>
							</form>
						</div>
						<div class="card-footer text-center">
							<a href="/signin" class="text-decoration-none">Back to Login</a>
						</div>
					</div>
				</div>
			</div>
		</div>
	</section>
</body>
</html>
