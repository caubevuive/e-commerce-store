<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Home</title>
</head>
<body>
	<section>
		<!-- Start Slider -->
		<div id="carouselExample" class="carousel slide">
			<div class="carousel-inner">
				<div class="carousel-item active">
					<img th:src="@{/img/ecom1.png}" class="d-block w-100" alt="..."
						height="350px">
				</div>

				<div class="carousel-item">
					<img th:src="@{/img/ecom3.jpg}" class="d-block w-100" alt="..."
						height="350px">
				</div>

				<div class="carousel-item">
					<img th:src="@{/img/ecom2.jpg}" class="d-block w-100" alt="..."
						height="350px">
				</div>
			</div>
			<button class="carousel-control-prev" type="button"
				data-bs-target="#carouselExample" data-bs-slide="prev">
				<span class="carousel-control-prev-icon" aria-hidden="true"></span>
				<span class="visually-hidden">Previous</span>
			</button>
			<button class="carousel-control-next" type="button"
				data-bs-target="#carouselExample" data-bs-slide="next">
				<span class="carousel-control-next-icon" aria-hidden="true"></span>
				<span class="visually-hidden">Next</span>
			</button>
		</div>
		<!-- End Slider -->


		<!-- Start Category Module -->
		<div class="container my-4">
			<p class="text-center fs-4 fw-bold mb-4">Category</p>
			<div class="row g-3 justify-content-center">

				<div class="col-6 col-md-2">
					<div
						class="card rounded-circle shadow-sm p-3 bg-body-tertiary h-100">
						<div
							class="card-body text-center p-0 d-flex flex-column align-items-center justify-content-center">
							<img th:src="@{/img/category_img/appli.png}" width="65%"
								height="100px" style="object-fit: contain;">
							<p class="mt-2 mb-0 fw-medium">Electronics</p>
						</div>
					</div>
				</div>

				<div class="col-6 col-md-2">
					<div
						class="card rounded-circle shadow-sm p-3 bg-body-tertiary h-100">
						<div
							class="card-body text-center p-0 d-flex flex-column align-items-center justify-content-center">
							<img th:src="@{/img/category_img/beuty.png}" width="65%"
								height="100px" style="object-fit: contain;">
							<p class="mt-2 mb-0 fw-medium">Beauty</p>
						</div>
					</div>
				</div>

				<div class="col-6 col-md-2">
					<div
						class="card rounded-circle shadow-sm p-3 bg-body-tertiary h-100">
						<div
							class="card-body text-center p-0 d-flex flex-column align-items-center justify-content-center">
							<img th:src="@{/img/category_img/pant.png}" width="65%"
								height="100px" style="object-fit: contain;">
							<p class="mt-2 mb-0 fw-medium">Clothes</p>
						</div>
					</div>
				</div>

				<div class="col-6 col-md-2">
					<div
						class="card rounded-circle shadow-sm p-3 bg-body-tertiary h-100">
						<div
							class="card-body text-center p-0 d-flex flex-column align-items-center justify-content-center">
							<img th:src="@{/img/category_img/laptop.jpg}" width="65%"
								height="100px" style="object-fit: contain;">
							<p class="mt-2 mb-0 fw-medium">Laptop</p>
						</div>
					</div>
				</div>

				<div class="col-6 col-md-2">
					<div
						class="card rounded-circle shadow-sm p-3 bg-body-tertiary h-100">
						<div
							class="card-body text-center p-0 d-flex flex-column align-items-center justify-content-center">
							<img th:src="@{/img/category_img/mobile.png}" width="65%"
								height="100px" style="object-fit: contain;">
							<p class="mt-2 mb-0 fw-medium">Mobile</p>
						</div>
					</div>
				</div>

				<div class="col-6 col-md-2">
					<div
						class="card rounded-circle shadow-sm p-3 bg-body-tertiary h-100">
						<div
							class="card-body text-center p-0 d-flex flex-column align-items-center justify-content-center">
							<img th:src="@{/img/category_img/groccery.jpg}" width="65%"
								height="100px" style="object-fit: contain;">
							<p class="mt-2 mb-0 fw-medium">Grocery</p>
						</div>
					</div>
				</div>

			</div>
		</div>
		<!-- End Category Module -->


		<!-- Start Latest Product Module -->
		<div class="container my-5">
			<p class="text-center fs-4 fw-bold mb-4">Latest Product</p>
			<div class="row g-3">

				<div class="col-6 col-md-3">
					<div class="card h-100 shadow-sm">
						<div
							class="card-body text-center d-flex flex-column justify-content-between p-3">
							<img alt="" th:src="@{/img/product_img/laptop.jpg}"
								class="img-fluid mx-auto mb-2"
								style="height: 140px; object-fit: contain;">
							<p class="text-center mb-0 fw-semibold">HP Laptop</p>
						</div>
					</div>
				</div>

				<div class="col-6 col-md-3">
					<div class="card h-100 shadow-sm">
						<div
							class="card-body text-center d-flex flex-column justify-content-between p-3">
							<img alt="" th:src="@{/img/product_img/laptop.jpg}"
								class="img-fluid mx-auto mb-2"
								style="height: 140px; object-fit: contain;">
							<p class="text-center mb-0 fw-semibold">HP Laptop</p>
						</div>
					</div>
				</div>

				<div class="col-6 col-md-3">
					<div class="card h-100 shadow-sm">
						<div
							class="card-body text-center d-flex flex-column justify-content-between p-3">
							<img alt="" th:src="@{/img/product_img/laptop.jpg}"
								class="img-fluid mx-auto mb-2"
								style="height: 140px; object-fit: contain;">
							<p class="text-center mb-0 fw-semibold">HP Laptop</p>
						</div>
					</div>
				</div>

				<div class="col-6 col-md-3">
					<div class="card h-100 shadow-sm">
						<div
							class="card-body text-center d-flex flex-column justify-content-between p-3">
							<img alt="" th:src="@{/img/product_img/laptop.jpg}"
								class="img-fluid mx-auto mb-2"
								style="height: 140px; object-fit: contain;">
							<p class="text-center mb-0 fw-semibold">HP Laptop</p>
						</div>
					</div>
				</div>

			</div>
		</div>
		<!-- End Latest Product Module -->
	</section>
</body>
</html>
