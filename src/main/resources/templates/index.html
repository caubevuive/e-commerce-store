<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Home</title>
</head>
<body>
	<section>
		<!-- Start Slider -->
		<div id="carouselExample" class="carousel slide">
			<div class="carousel-inner">
				<div class="carousel-item active">
					<img th:src="@{/img/ecom1.png}" class="d-block w-100" alt="..." height="350px">
				</div>

				<div class="carousel-item">
					<img th:src="@{/img/ecom3.jpg}" class="d-block w-100" alt="..." height="350px">
				</div>

				<div class="carousel-item">
					<img th:src="@{/img/ecom2.jpg}" class="d-block w-100" alt="..." height="350px">
				</div>
			</div>
			<button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
				<span class="carousel-control-prev-icon" aria-hidden="true"></span>
				<span class="visually-hidden">Previous</span>
			</button>
			<button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
				<span class="carousel-control-next-icon" aria-hidden="true"></span>
				<span class="visually-hidden">Next</span>
			</button>
		</div>
		<!-- End Slider -->


		<!-- Start Category Module -->
		<div class="container my-4">
			<p class="text-center fs-4 fw-bold mb-4">Category</p>
			
			
			<div class="row justify-content-center">
				
				<!-- Item 1 -->
				<div class="col-6 col-md-2 mb-3">
					<div class="card rounded-circle shadow-sm p-3 bg-body-tertiary">
						<div class="card-body text-center p-0">
							<img th:src="@{/img/category_img/appli.png}" width="65%" height="140px" style="object-fit: contain;">
							<p class="mt-2 mb-0">Electronics</p>
						</div>
					</div>
				</div>

				<!-- Item 2 -->
				<div class="col-6 col-md-2 mb-3">
					<div class="card rounded-circle shadow-sm p-3 bg-body-tertiary">
						<div class="card-body text-center p-0">
							<img th:src="@{/img/category_img/beuty.png}" width="65%" height="140px" style="object-fit: contain;">
							<p class="mt-2 mb-0">Beauty</p>
						</div>
					</div>
				</div>

				<!-- Item 3 -->
				<div class="col-6 col-md-2 mb-3">
					<div class="card rounded-circle shadow-sm p-3 bg-body-tertiary">
						<div class="card-body text-center p-0">
							<img th:src="@{/img/category_img/pant.png}" width="65%" height="140px" style="object-fit: contain;">
							<p class="mt-2 mb-0">Clothes</p>
						</div>
					</div>
				</div>

				<!-- Item 4 -->
				<div class="col-6 col-md-2 mb-3">
					<div class="card rounded-circle shadow-sm p-3 bg-body-tertiary">
						<div class="card-body text-center p-0">
							<img th:src="@{/img/category_img/laptop.jpg}" width="65%" height="140px" style="object-fit: contain;">
							<p class="mt-2 mb-0">Laptop</p>
						</div>
					</div>
				</div>

				<!-- Item 5 -->
				<div class="col-6 col-md-2 mb-3">
					<div class="card rounded-circle shadow-sm p-3 bg-body-tertiary">
						<div class="card-body text-center p-0">
							<img th:src="@{/img/category_img/mobile.png}" width="65%" height="140px" style="object-fit: contain;">
							<p class="mt-2 mb-0">Mobile</p>
						</div>
					</div>
				</div>

				<!-- Item 6 -->
				<div class="col-6 col-md-2 mb-3">
					<div class="card rounded-circle shadow-sm p-3 bg-body-tertiary">
						<div class="card-body text-center p-0">
							<img th:src="@{/img/category_img/groccery.jpg}" width="65%" height="140px" style="object-fit: contain;">
							<p class="mt-2 mb-0">Grocery</p>
						</div>
					</div>
				</div>

			</div>
		</div>
		<!-- End Category Module -->
		<!-- Start latest Product Module -->
		<!-- End latest Product Module -->
	</section>
</body>
</html>
