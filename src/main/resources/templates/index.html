<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Home</title>
</head>
<body>
	<section>
		<!-- Start Slider -->
		<div id="carouselExample" class="carousel slide">
			<div class="carousel-inner">
				<div class="carousel-item active">
					<img th:src="@{/img/ecom1.png}" class="d-block w-100" alt="..."
						height="350px">
				</div>
				<div class="carousel-item">
					<img th:src="@{/img/ecom3.jpg}" class="d-block w-100" alt="..."
						height="350px">
				</div>
				<div class="carousel-item">
					<img th:src="@{/img/ecom2.jpg}" class="d-block w-100" alt="..."
						height="350px">
				</div>
			</div>
			<button class="carousel-control-prev" type="button"
				data-bs-target="#carouselExample" data-bs-slide="prev">
				<span class="carousel-control-prev-icon" aria-hidden="true"></span>
				<span class="visually-hidden">Previous</span>
			</button>
			<button class="carousel-control-next" type="button"
				data-bs-target="#carouselExample" data-bs-slide="next">
				<span class="carousel-control-next-icon" aria-hidden="true"></span>
				<span class="visually-hidden">Next</span>
			</button>
		</div>
		<!-- End Slider -->

		<!-- Start Category Module (Dùng d-flex wrap và căn giữa để các ô category luôn đều nhau) -->
		<div class="container my-4">
			<p class="text-center fs-4 fw-bold mb-4">Category</p>
			<div class="row justify-content-center g-3 text-center">
				<div class="col-6 col-sm-4 col-md-3 col-lg-2" th:each="cat : ${category}">
					<a th:href="@{'/products?category=' + ${cat.name}}" class="text-decoration-none text-dark">
						<div class="card rounded-circle shadow-sm p-3 bg-body-tertiary h-100">
							<div class="card-body text-center p-0 d-flex flex-column align-items-center justify-content-center">
								<img th:src="@{'/img/category_img/' + ${cat.imageName}}" width="65%"
									height="100px" style="object-fit: contain;" alt="Category">
								<p class="mt-2 mb-0 fw-medium" th:text="${cat.name}">Electronics</p>
							</div>
						</div>
					</a>
				</div>
			</div>
		</div>
		<!-- End Category Module -->

		<!-- Start Latest Product Module (Sử dụng chuẩn lưới Bootstrap 4 cột, tự động dàn đều lấp đầy khung) -->
		<div class="container my-5">
			<p class="text-center fs-4 fw-bold mb-4">Latest Product</p>
			<div class="row row-cols-1 row-cols-sm-2 row-cols-md-4 g-4">
				<div class="col" th:each="p : ${products}">
					<a th:href="@{'/product/' + ${p.id}}" class="text-decoration-none text-dark">
						<div class="card h-100 shadow-sm border-0 w-100">
							<div class="card-body text-center d-flex flex-column justify-content-between p-3">
								<img alt="Product" th:src="@{'/img/product_img/' + ${p.image}}"
									class="img-fluid mx-auto mb-2"
									style="height: 140px; object-fit: contain;">
								<div>
									<p class="text-center mb-1 fw-semibold" th:text="${p.title}">HP Laptop</p>
								</div>
							</div>
						</div>
					</a>
				</div>
			</div>
		</div>
		<!-- End Latest Product Module -->
	</section>
</body>
</html>
