<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Ecom Store - Home</title>
</head>
<body>
	<section>
		<!-- 1. Hero Banner Carousel -->
		<div class="container my-4">
			<div id="heroCarousel" class="carousel slide" data-bs-ride="carousel"
				data-bs-interval="4000">

				<!-- Indicators -->
				<div class="carousel-indicators mb-2">
					<button type="button" data-bs-target="#heroCarousel"
						data-bs-slide-to="0" class="active" aria-current="true"
						aria-label="Slide 1"></button>
					<button type="button" data-bs-target="#heroCarousel"
						data-bs-slide-to="1" aria-label="Slide 2"></button>
					<button type="button" data-bs-target="#heroCarousel"
						data-bs-slide-to="2" aria-label="Slide 3"></button>
				</div>

				<div class="carousel-inner">
					<!-- SLIDE 1: Laptop Sale -->
					<div class="carousel-item active">
						<div
							class="p-0 bg-light border rounded-4 position-relative overflow-hidden shadow-sm text-center">
							<img th:src="@{/img/ecom1.png}"
								class="img-fluid w-100 hero-banner-img" alt="Laptop Banner">
						</div>
					</div>

					<!-- SLIDE 2: Smartphone Deal -->
					<div class="carousel-item">
						<div
							class="p-0 bg-light border rounded-4 position-relative overflow-hidden shadow-sm text-center">
							<img th:src="@{/img/ecom2.png}"
								class="img-fluid w-100 hero-banner-img" alt="Smartphone Banner">
						</div>
					</div>

					<!-- SLIDE 3: Fashion / Accessories -->
					<div class="carousel-item">
						<div
							class="p-0 bg-light border rounded-4 position-relative overflow-hidden shadow-sm text-center">
							<img th:src="@{/img/ecom3.png}"
								class="img-fluid w-100 hero-banner-img" alt="Fashion Banner">
						</div>
					</div>
				</div>

				<!-- Controls -->
				<button class="carousel-control-prev" type="button"
					data-bs-target="#heroCarousel" data-bs-slide="prev">
					<span
						class="carousel-control-prev-icon bg-dark bg-opacity-25 rounded-circle p-3"
						aria-hidden="true"></span> <span class="visually-hidden">Previous</span>
				</button>
				<button class="carousel-control-next" type="button"
					data-bs-target="#heroCarousel" data-bs-slide="next">
					<span
						class="carousel-control-next-icon bg-dark bg-opacity-25 rounded-circle p-3"
						aria-hidden="true"></span> <span class="visually-hidden">Next</span>
				</button>
			</div>
		</div>

		<!-- 2. Category Section (Trượt ngang 2 hàng + Nút mũi tên nổi 2 bên) -->
		<div class="container my-5">
			<div class="d-flex justify-content-between align-items-center mb-4">
				<div>
					<h4 class="fw-bold mb-1 border-start border-primary border-4 ps-2">Category</h4>
					<p class="text-muted small mb-0">Explore our product categories</p>
				</div>
				<a href="/products"
					class="text-primary text-decoration-none fw-semibold small">
					See All <i class="bi bi-arrow-right"></i>
				</a>
			</div>

			<!-- Container bọc slider và nút mũi tên -->
			<div class="category-slider-container position-relative px-2">
				<!-- Nút mũi tên trái -->
				<button class="cat-btn-prev" onclick="scrollCategory('left')"
					type="button">
					<i class="bi bi-chevron-left text-dark"></i>
				</button>

				<!-- Thanh trượt chứa các card danh mục -->
				<div id="categoryScrollWrapper" class="category-scroll-wrapper">
					<div th:each="cat : ${category}">
						<a th:href="@{'/products?category=' + ${cat.name}}"
							class="text-decoration-none">
							<div
								class="card bg-light border-0 rounded-4 p-3 text-center h-100 shadow-sm card-sh category-card-item">
								<div
									class="bg-white rounded-circle p-2 mx-auto mb-2 shadow-sm d-flex align-items-center justify-content-center category-img-container">
									<img th:src="@{'/img/category_img/' + ${cat.imageName}}"
										class="img-fluid category-img" th:alt="${cat.name}">
								</div>
								<h6 class="fw-semibold text-dark mb-1 small text-truncate"
									th:text="${cat.name}">Electronics</h6>
							</div>
						</a>
					</div>
				</div>

				<!-- Nút mũi tên phải -->
				<button class="cat-btn-next" onclick="scrollCategory('right')"
					type="button">
					<i class="bi bi-chevron-right text-dark"></i>
				</button>
			</div>
		</div>

		<!-- 3. Featured Products Section -->
		<div class="container my-5">
			<div class="d-flex justify-content-between align-items-center mb-4">
				<div>
					<h4 class="fw-bold mb-1 border-start border-primary border-4 ps-2">Featured
						Products</h4>
					<p class="text-muted small mb-0">Discover our most popular
						products</p>
				</div>
				<a href="/products"
					class="text-primary text-decoration-none fw-semibold small">See
					All <i class="bi bi-arrow-right"></i>
				</a>
			</div>

			<div
				class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-6 g-3">
				<div class="col" th:each="p : ${products}">
					<div
						class="card h-100 bg-white border rounded-4 p-2 position-relative shadow-sm card-sh">
						<span
							class="badge bg-danger position-absolute top-0 start-0 m-2 rounded-pill small"
							th:if="${p.discount > 0}" th:text="${'-' + p.discount + '%'}">-15%</span>
						<button
							class="btn btn-sm btn-light rounded-circle position-absolute top-0 end-0 m-2 shadow-sm text-secondary border-0 wishlist-btn"
							type="button">
							<i class="bi bi-heart small"></i>
						</button>

						<a th:href="@{'/product/' + ${p.id}}"
							class="text-center p-2 d-block"> <img
							th:src="@{'/img/product_img/' + ${p.image}}"
							class="card-img-top product-img" th:alt="${p.title}">
						</a>

						<div class="card-body d-flex flex-column p-2">
							<h6
								class="card-title fw-semibold text-dark text-truncate mb-1 small"
								th:text="${p.title}">Product Name</h6>
							<div class="text-warning small mb-2 rating-stars">
								<i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i
									class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i
									class="bi bi-star-fill"></i> <span class="text-muted ms-1">(4.8)</span>
							</div>
							<div class="mt-auto">
								<div class="d-flex align-items-baseline gap-1 mb-2 flex-wrap">
									<span class="fw-bold text-primary"
										th:text="${#numbers.formatDecimal(p.discountPrice, 0, 'COMMA', 0, 'POINT') + '$'}">$1,000</span>
									<small
										class="text-decoration-line-through text-muted original-price"
										th:if="${p.discount > 0}"
										th:text="${#numbers.formatDecimal(p.price, 0, 'COMMA', 0, 'POINT') + '$'}">$1,200</small>
								</div>
								<a
									th:href="@{'/add-cart?pid=' + ${p.id} + '&uid=' + ${user != null ? user.id : ''}}"
									class="btn btn-primary w-100 btn-sm rounded-3 fw-medium btn-add-cart">
									<i class="bi bi-cart-plus me-1"></i> Add to Cart
								</a>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>


	</section>
</body>
</html>
