<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Verify OTP - Ecom Store</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/otp.css}">
</head>
<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow p-4">
                <div class="text-center mb-4">
                    <h3 class="fw-bold">Verify Your Account</h3>
                    <p class="text-muted">An OTP code has been sent to your Gmail address. Please enter it below to complete your registration.</p>
                </div>

                <!-- Alert messages -->
                <div th:if="${error}" class="alert alert-danger text-center" role="alert" th:text="${error}"></div>
                <div th:if="${msg}" class="alert alert-success text-center" role="alert" th:text="${msg}"></div>
                <div th:if="${session.succMsg}" class="alert alert-success text-center" role="alert" th:text="${session.succMsg}"></div>

                <form th:action="@{/verify-otp}" method="post">
                    <div class="mb-3">
                        <label for="otp" class="form-label fw-bold">OTP Code</label>
                        <input type="text" class="form-control text-center fs-4" id="otp" name="otp"
                               maxlength="6" placeholder="******" required autofocus autocomplete="off">
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2">Verify Account</button>
                </form>

                <div class="text-center mt-3">
                    <p class="text-muted">Didn't receive code? <a th:href="@{/resend-otp}">Resend OTP</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
