<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Register</title>
</head>
<body>
	<section>
		<div class="container mt-5 mb-5">
			<div class="row align-items-center">
				<!-- Cột bên trái: Hiển thị hình ảnh -->
				<div class="col-md-5 p-4 text-center">
					<img th:src="@{/img/ecom.png}" class="img-fluid" alt="Register Image">
				</div>

				<!-- Cột bên phải: Form Register -->
				<div class="col-md-7">
					<div class="card shadow">
						<div class="card-header text-center bg-primary text-white">
							<p class="fs-4 mb-0">Register</p>

							<!-- Display Alert Message -->
							<th:block th:if="${session.succMsg}">
								<p class="text-success fw-bold mt-2"
									th:text="${session.succMsg}"></p>
								<th:block th:text="${@commonServiceImpl.removeSessionMessage()}"></th:block>
							</th:block>
							<th:block th:if="${session.errorMsg}">
								<p class="text-danger fw-bold mt-2"
									th:text="${session.errorMsg}"></p>
								<th:block th:text="${@commonServiceImpl.removeSessionMessage()}"></th:block>
							</th:block>
						</div>

						<div class="card-body">
							<form action="/saveUser" method="post"
								enctype="multipart/form-data">
								<div class="row">
									<div class="col-md-6 mb-3">
										<label>Full Name</label> <input type="text" name="name"
											class="form-control" required>
									</div>
									<div class="col-md-6 mb-3">
										<label>Mobile Number</label> <input type="number"
											name="mobileNumber" class="form-control" required>
									</div>
								</div>

								<div class="mb-3">
									<label>Email</label> <input type="email" name="email"
										class="form-control" required>
								</div>

								<div class="row">
									<div class="col-md-6 mb-3">
										<label>Address</label> <input type="text" name="address"
											class="form-control" required>
									</div>
									<div class="col-md-6 mb-3">
										<label>City</label> <input type="text" name="city"
											class="form-control" required>
									</div>
								</div>

								<div class="row">
									<div class="col-md-6 mb-3">
										<label>State</label> <input type="text" name="state"
											class="form-control" required>
									</div>
									<div class="col-md-6 mb-3">
										<label>Pincode</label> <input type="number" name="pincode"
											class="form-control" required>
									</div>
								</div>

								<div class="row">
									<div class="col-md-6 mb-3">
										<label>Password</label> <input type="password" name="password"
											class="form-control" required>
									</div>
									<div class="col-md-6 mb-3">
										<label>Profile Image</label> <input type="file" name="img"
											class="form-control">
									</div>
								</div>

								<button class="btn btn-primary col-md-12">Register</button>
							</form>
						</div>

						<div class="card-footer text-center">
							Have an account ? <a href="/signin" class="text-decoration-none">Login</a>
						</div>
					</div>
				</div>
			</div>
		</div>
	</section>
</body>
</html>
