<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Register</title>
</head>
<body>
	<section>
		<div class="container my-4">
			<div class="row align-items-center justify-content-center">

				<!-- Cột bên trái: Hình ảnh -->
				<div class="col-md-5 text-center mb-4 mb-md-0">
					<img alt="Register Illustration" th:src="@{/img/ecom.png}"
						class="img-fluid" style="max-height: 380px; object-fit: contain;">
				</div>

				<!-- Cột bên phải: Form Đăng ký -->
				<div class="col-md-7">
					<div class="card shadow-sm border">
						<div class="card-header bg-light">
							<p class="fs-4 text-center mb-0">Register</p>
						</div>
						<div class="card-body p-4">
							<form action="/saveUser" method="post"
								enctype="multipart/form-data">

								<!-- Hàng 1: Full Name & Mobile Number -->
								<div class="row mb-3">
									<div class="col">
										<label class="form-label">Full Name</label> <input type="text"
											name="name" class="form-control" required>
									</div>
									<div class="col">
										<label class="form-label">Mobile Number</label> <input
											type="number" name="mobileNumber" class="form-control"
											required>
									</div>
								</div>

								<!-- Hàng 2: Email -->
								<div class="mb-3">
									<label class="form-label">Email</label> <input type="email"
										name="email" class="form-control" required>
								</div>

								<!-- Hàng 3: Address & City -->
								<div class="row mb-3">
									<div class="col">
										<label class="form-label">Address</label> <input type="text"
											name="address" class="form-control" required>
									</div>
									<div class="col">
										<label class="form-label">City</label> <input type="text"
											name="city" class="form-control" required>
									</div>
								</div>

								<!-- Hàng 4: State & Pincode -->
								<div class="row mb-3">
									<div class="col">
										<label class="form-label">State</label> <input type="text"
											name="state" class="form-control" required>
									</div>
									<div class="col">
										<label class="form-label">Pincode</label> <input type="number"
											name="pincode" class="form-control" required>
									</div>
								</div>

								<!-- Hàng 5: Password & Confirm Password -->
								<div class="row mb-3">
									<div class="col">
										<label class="form-label">Password</label> <input
											type="password" name="password" class="form-control" required>
									</div>
									<div class="col">
										<label class="form-label">Confirm Password</label> <input
											type="password" name="cpassword" class="form-control"
											required>
									</div>
								</div>

								<!-- Hàng 6: Profile Image -->
								<div class="mb-3">
									<label class="form-label">Profile Image</label> <input
										type="file" name="img" class="form-control">
								</div>

								<!-- Nút Đăng ký -->
								<button type="submit"
									class="btn bg-primary text-white w-100 py-2 mt-2">Register</button>
							</form>
						</div>

						<!-- Card Footer -->
						<div class="card-footer text-center bg-light">
							have an account ? <a th:href="@{/login}"
								class="text-decoration-none">Login</a>
						</div>

					</div>
				</div>

			</div>
		</div>
	</section>
</body>
</html>
