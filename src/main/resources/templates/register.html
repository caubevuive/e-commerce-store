<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Register</title>
</head>
<body>
	<section>
		<div class="container mt-5 mb-5">
			<div class="row align-items-center">
				
				<div class="col-md-5 p-4 text-center">
					<img th:src="@{/img/ecom.png}" class="img-fluid"
						alt="Register Image" style="max-height: 450px; object-fit: contain;">
				</div>

				<div class="col-md-7">
					<div class="card shadow">
						<div class="card-header text-center bg-primary text-white">
							<p class="fs-4 mb-0">Register</p>

							<!-- Display Alert Message -->
							<th:block th:if="${session.succMsg}">
								<p class="text-success fw-bold mt-2"
									th:text="${session.succMsg}"></p>
								<th:block th:text="${@commonServiceImpl.removeSessionMessage()}"></th:block>
							</th:block>
							<th:block th:if="${session.errorMsg}">
								<p class="text-danger fw-bold mt-2"
									th:text="${session.errorMsg}"></p>
								<th:block th:text="${@commonServiceImpl.removeSessionMessage()}"></th:block>
							</th:block>
						</div>

						<div class="card-body">
							<form action="/saveUser" method="post"
								enctype="multipart/form-data" th:object="${user}">

								<div class="row">
									<div class="col-md-6 mb-3">
										<label>Full Name</label> <input type="text" name="name"
											th:field="*{name}" class="form-control">
										
										<p class="text-danger small mb-0 mt-1"
											th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
									</div>
									<div class="col-md-6 mb-3">
										<label>Mobile Number</label> <input type="number"
											name="mobileNumber" th:field="*{mobileNumber}"
											class="form-control">
										
										<p class="text-danger small mb-0 mt-1"
											th:if="${#fields.hasErrors('mobileNumber')}"
											th:errors="*{mobileNumber}"></p>
									</div>
								</div>

								<div class="mb-3">
									<label>Email</label> <input type="email" name="email"
										th:field="*{email}" class="form-control">
									
									<p class="text-danger small mb-0 mt-1"
										th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
								</div>

								<div class="row">
									<div class="col-md-6 mb-3">
										<label>Address</label> <input type="text" name="address"
											th:field="*{address}" class="form-control">
										
										<p class="text-danger small mb-0 mt-1"
											th:if="${#fields.hasErrors('address')}"
											th:errors="*{address}"></p>
									</div>
									<div class="col-md-6 mb-3">
										<label>City</label> <input type="text" name="city"
											th:field="*{city}" class="form-control">
										
										<p class="text-danger small mb-0 mt-1"
											th:if="${#fields.hasErrors('city')}" th:errors="*{city}"></p>
									</div>
								</div>

								<div class="row">
									<div class="col-md-6 mb-3">
										<label>State</label> <input type="text" name="state"
											th:field="*{state}" class="form-control">
										
										<p class="text-danger small mb-0 mt-1"
											th:if="${#fields.hasErrors('state')}" th:errors="*{state}"></p>
									</div>
									<div class="col-md-6 mb-3">
										<label>Pincode</label> <input type="number" name="pincode"
											th:field="*{pincode}" class="form-control">
										
										<p class="text-danger small mb-0 mt-1"
											th:if="${#fields.hasErrors('pincode')}"
											th:errors="*{pincode}"></p>
									</div>
								</div>

								<div class="row">
									<div class="col-md-6 mb-3">
										<label>Password</label> <input type="password" name="password"
											th:field="*{password}" class="form-control">
										
										<p class="text-danger small mb-0 mt-1"
											th:if="${#fields.hasErrors('password')}"
											th:errors="*{password}"></p>
									</div>
									<div class="col-md-6 mb-3">
										<label>Profile Image</label> <input type="file" name="img"
											class="form-control">
									</div>
								</div>

								<button class="btn btn-primary col-md-12 py-2 mb-3">Register</button>
							</form>

							<div class="position-relative text-center my-3">
								<hr class="border-secondary opacity-25">
								<span class="position-absolute top-50 start-50 translate-middle px-3 text-muted small bg-white">Hoặc</span>
							</div>

							
							<a href="/oauth2/authorization/google" class="btn w-100 d-flex align-items-center justify-content-center gap-2 py-2 text-dark bg-white border shadow-sm rounded-2" style="border-color: #dadce0 !important; transition: background-color 0.2s;">
								<i class="fa-brands fa-google text-danger"></i>
								<span class="fw-medium" style="font-size: 14.5px; color: #3c4043;">Log in / Sign up with Google</span>
							</a>
						</div>

					</div>
				</div>
			</div>
		</div>
	</section>
</body>
</html>
