<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Login</title>
</head>
<body>
	<section>
		<div class="container my-5">
			<div class="row align-items-center justify-content-center">

				<div class="col-md-6 text-center">
					<img alt="Login Illustration" th:src="@{/img/ecom.png}"
						class="img-fluid" style="max-height: 380px; object-fit: contain;">
				</div>

				<div class="col-md-5">
					<div class="card shadow-sm border">
						<div class="card-header bg-light">
							<p class="fs-4 text-center mb-0">Login</p>
						</div>
						<div class="card-body">

							<!-- Error Alert -->
							<div th:if="${param.error}" class="alert alert-danger text-center p-2 mb-3" role="alert">
								<th:block th:if="${session.SPRING_SECURITY_LAST_EXCEPTION != null}">
									[[${session.SPRING_SECURITY_LAST_EXCEPTION.message}]]
								</th:block>
								<th:block th:if="${session.SPRING_SECURITY_LAST_EXCEPTION == null}">
									Invalid email or password!
								</th:block>
							</div>

							<!-- Logout Alert -->
							<div th:if="${param.logout}" class="alert alert-success text-center p-2 mb-3" role="alert">
								You have been logged out successfully.
							</div>

							<form action="/login" method="post">
								<div class="mb-3">
									<label class="form-label">Email</label> 
									<input class="form-control" name="username" type="email" required>
								</div>

								<div class="mb-3">
									<label class="form-label">Password</label> 
									<input class="form-control" name="password" type="password" required>
								</div>

								<button type="submit" class="btn bg-primary text-white w-100">Login</button>
							</form>
						</div>

						<!-- Card Footer -->
						<div class="card-footer text-center">
							<a href="/forgot-password" class="text-decoration-none">Forgot Password?</a><br>
							Don't have an account? <a href="/register" class="text-decoration-none">Create one</a>
						</div>

					</div>
				</div>

			</div>
		</div>
	</section>
</body>
</html>
