<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>User Profile</title>
</head>
<body>
	<section>
		<div class="container mt-5 p-5">
			<div class="row">
				<div class="col-md-6 offset-md-3">
					<div class="card shadow p-3 mb-5 bg-body rounded">
						<div class="card-header text-center">
							<p class="fs-4 fw-bold">My Profile</p>
							<!-- Hiển thị thông báo thành công/lỗi -->
							<th:block th:if="${session.succMsg}">
								<p class="text-success fw-bold">[[${session.succMsg}]]</p>
								<th:block th:text="${@commonUtil.removeSessionMessage()}"></th:block>
							</th:block>
							<th:block th:if="${session.errorMsg}">
								<p class="text-danger fw-bold">[[${session.errorMsg}]]</p>
								<th:block th:text="${@commonUtil.removeSessionMessage()}"></th:block>
							</th:block>
						</div>
						<div class="card-body">
							<form action="/user/update-profile" method="post"
								enctype="multipart/form-data">
								<input type="hidden" name="id" th:value="${user.id}">

								<div class="mb-3">
									<label class="form-label">Profile Image</label> <input
										type="file" name="img" class="form-control">
								</div>

								<div class="mb-3">
									<label class="form-label">Full Name</label> <input type="text"
										name="name" class="form-control" th:value="${user.name}"
										required>
								</div>

								<div class="mb-3">
									<label class="form-label">Email (Cannot be changed)</label> <input
										type="email" class="form-control" th:value="${user.email}"
										readonly>
								</div>

								<div class="mb-3">
									<label class="form-label">Mobile Number</label> <input
										type="text" name="mobileNumber" class="form-control"
										th:value="${user.mobileNumber}" required>
								</div>

								<div class="mb-3">
									<label class="form-label">Address</label> <input type="text"
										name="address" class="form-control" th:value="${user.address}">
								</div>

								<div class="row">
									<div class="col">
										<label class="form-label">City</label> <input type="text"
											name="city" class="form-control" th:value="${user.city}">
									</div>
									<div class="col">
										<label class="form-label">State</label> <input type="text"
											name="state" class="form-control" th:value="${user.state}">
									</div>
								</div>

								<div class="mb-3 mt-3">
									<label class="form-label">Pincode</label> <input type="text"
										name="pincode" class="form-control" th:value="${user.pincode}">
								</div>

								<div class="text-center">
									<button type="submit"
										class="btn bg-primary text-white col-md-12">Update
										Profile</button>
								</div>
							</form>
						</div>
					</div>
				</div>
			</div>
		</div>
	</section>
</body>
</html>
