<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>QR Payment - MB Bank</title>
</head>
<body>
	<section>
		<div class="container mt-5 p-5 text-center">
			<h2>Scan QR Code to Pay</h2>
			<p class="text-muted">Please use MB Bank or any banking app to scan the QR code below</p>
			
			<div class="card mx-auto p-4 shadow" style="max-width: 450px;">
				
				<img th:src="@{'https://img.vietqr.io/image/' + ${bankId} + '-' + ${accountNo} + '-compact2.png?amount=' + ${totalOrderPrice} + '&addInfo=Thanh%20toan%20don%20hang&accountName=' + ${accountName}}" 
					 alt="MB Bank QR" class="img-fluid mb-3">
				
				<h5 class="fw-bold text-primary">Bank: MB Bank</h5>
				<p class="mb-1">Account Number: <strong class="text-dark" th:text="${accountNo}"></strong></p>
				<p class="mb-1">Account Name: <strong class="text-dark" th:text="${accountName}"></strong></p>
				<p class="mb-1">Amount to Transfer: <strong class="text-danger" th:text="${'$' + totalOrderPrice}"></strong></p>
				
				<hr>
			
				<a href="/user/qr-success" class="btn btn-success mt-2">I have completed the transfer</a>
			</div>
		</div>

		
		<script>
			const checkInterval = setInterval(function() {
				fetch('/user/check-payment-status')
					.then(response => response.json())
					.then(data => {
						if (data.isPaid === true) {
							clearInterval(checkInterval); 
							window.location.href = '/user/qr-success'; 
						}
					})
					.catch(error => console.error('Error checking payment status:', error));
			}, 3000); 
		</script>
	</section>
</body>
</html>
