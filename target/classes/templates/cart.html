<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="ISO-8859-1">
<title>Cart Page</title>
<!-- Thêm FontAwesome để hiển thị icon sinh động hơn -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">
	<section>
		<div class="container py-5">
			
			<div class="row mb-4">
				<div class="col-md-12">
					<h2 class="fw-bold text-dark"><i class="fa-solid fa-cart-shopping me-2 text-primary"></i> Shopping Cart</h2>
					<nav aria-label="breadcrumb">
						<ol class="breadcrumb">
							<li class="breadcrumb-item"><a href="/" class="text-decoration-none">Home</a></li>
							<li class="breadcrumb-item active" aria-current="page">Cart</li>
						</ol>
					</nav>
				</div>
			</div>

			
			<div th:if="${session.succMsg}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
				<i class="fa-solid fa-circle-check me-2"></i> <span th:text="${session.succMsg}"></span>
				<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
			</div>

			
			<div th:if="${session.errorMsg}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
				<i class="fa-solid fa-triangle-exclamation me-2"></i> <span th:text="${session.errorMsg}"></span>
				<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
			</div>

			<div class="row">
				
				<div class="col-lg-8 mb-4">
					<div class="card border-0 shadow-sm rounded-4 overflow-hidden">
						<div class="card-body p-0">
							<div class="table-responsive">
								<table class="table align-middle mb-0">
									<thead class="table-light text-uppercase fs-7">
										<tr>
											<th scope="col" class="py-3 ps-4">Image</th>
											<th scope="col" class="py-3">Product Name</th>
											<th scope="col" class="py-3">Price</th>
											<th scope="col" class="py-3 text-center">Quantity</th>
											<th scope="col" class="py-3 pe-4">Total Price</th>
										</tr>
									</thead>
									<tbody>
										<tr th:each="cart : ${carts}">
											<td class="ps-4 py-3">
												<img th:src="@{'/img/product_img/' + ${cart.product.image}}" class="rounded-3 border object-fit-cover shadow-sm" width="60px" height="60px" alt="Product Image">
											</td>
											<td>
												<h6 class="mb-0 fw-semibold text-dark" th:text="${cart.product.title}">Product Name</h6>
											</td>
											<td>
												<span class="fw-medium text-secondary" th:text="'$' + ${#numbers.formatDecimal(cart.product.discountPrice, 1, 2)}">$0.0</span>
											</td>
											<td class="text-center">
												<div class="d-inline-flex align-items-center border rounded-pill px-2 py-1 bg-white shadow-sm">
													<a class="btn btn-sm btn-light text-success fw-bold rounded-circle px-2 py-0" th:href="@{/user/cart/quantityUpdate(sy='de', cid=${cart.id})}">-</a>
													<span class="mx-3 fw-semibold" th:text="${cart.quantity}">1</span>
													<a class="btn btn-sm btn-light text-success fw-bold rounded-circle px-2 py-0" th:href="@{/user/cart/quantityUpdate(sy='in', cid=${cart.id})}">+</a>
												</div>
											</td>
											<td class="pe-4">
												<span class="fw-bold text-primary" th:text="'$' + ${#numbers.formatDecimal(cart.totalPrice, 1, 2)}">$0.0</span>
											</td>
										</tr>
									</tbody>
								</table>
							</div>
						</div>
					</div>
				</div>

				
				<div class="col-lg-4">
					<div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
						<h4 class="fw-bold mb-3">Order Summary</h4>
						<hr class="text-muted">
						<div class="d-flex justify-content-between mb-2">
							<span class="text-muted">Subtotal</span>
							<span class="fw-semibold" th:text="'$' + ${#numbers.formatDecimal(totalOrderPrice, 1, 2)}">$0.0</span>
						</div>
						<div class="d-flex justify-content-between mb-3">
							<span class="text-muted">Shipping</span>
							<span class="text-success fw-semibold">Free</span>
						</div>
						<hr class="text-muted">
						<div class="d-flex justify-content-between mb-4">
							<span class="fw-bold fs-5">Total Price</span>
							<span class="fw-bold fs-4 text-primary" th:text="'$' + ${#numbers.formatDecimal(totalOrderPrice, 1, 2)}">$0.0</span>
						</div>
						<a th:href="@{/user/orders}" class="btn btn-warning w-100 py-3 rounded-pill fw-bold shadow-sm text-dark">
							<i class="fa-solid fa-lock me-2"></i> Proceed Checkout
						</a>
					</div>
				</div>
			</div>
		</div>
	</section>
</body>
</html>
